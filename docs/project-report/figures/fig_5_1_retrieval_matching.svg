<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5868"/></marker><marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5651d"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="15" y="15" width="400" height="72" rx="7" fill="#f7f9fb" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="44.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Candidate context</text><text x="215.0" y="68.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">profile + structured resume</text><rect x="15" y="115" width="400" height="90" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="143.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Normalise terms</text><text x="215.0" y="167.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">skills, roles, interests,</text><text x="215.0" y="187.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">education, projects</text><path d="M 215 89 L 215 113" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="233" width="400" height="90" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="261.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Build query</text><text x="215.0" y="285.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">explicit query, or the</text><text x="215.0" y="305.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">first 40 normalised terms</text><path d="M 215 207 L 215 231" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="351" width="400" height="90" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="379.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Embed query</text><text x="215.0" y="403.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">MiniLM-L6-v2 → 384-d,</text><text x="215.0" y="423.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">L2-normalised</text><path d="M 215 325 L 215 349" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="469" width="400" height="90" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="497.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Exact FAISS search</text><text x="215.0" y="521.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">IndexFlatIP, all 960 chunks</text><text x="215.0" y="541.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">(cosine similarity)</text><path d="M 215 443 L 215 467" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="587" width="400" height="72" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="616.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Aggregate per job</text><text x="215.0" y="640.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">best chunk + 0.05 × Σ others</text><path d="M 215 561 L 215 585" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="687" width="400" height="72" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="215.0" y="716.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Top-k opportunities</text><text x="215.0" y="740.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">10 for matching, 5 for search</text><path d="M 215 661 L 215 685" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="787" width="400" height="110" rx="7" fill="#fff8e5" stroke="#b08d2e" stroke-width="1.6"/><text x="215.0" y="815.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Query-confidence flag</text><text x="215.0" y="839.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">share of query words found in</text><text x="215.0" y="859.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">the catalogue: ≥ 0.5 →</text><text x="215.0" y="879.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">confident, else unsupported_area</text><path d="M 215 761 L 215 785" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="475" y="15" width="410" height="72" rx="7" fill="#f7f9fb" stroke="#1f3a5f" stroke-width="1.6"/><text x="680.0" y="44.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">For each retrieved job</text><text x="680.0" y="68.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">load its structured record</text><path d="M 415 723 L 445 723 L 445 51 L 473 51" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="475" y="120" width="200" height="80" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="575.0" y="153.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Required 0.35</text><text x="575.0" y="177.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">exact / alias</text><rect x="685" y="120" width="200" height="80" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="785.0" y="153.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Preferred 0.15</text><text x="785.0" y="177.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">related = 0.5</text><rect x="475" y="212" width="200" height="80" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="575.0" y="245.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Experience 0.15</text><text x="575.0" y="269.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">rule-based</text><rect x="685" y="212" width="200" height="80" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="785.0" y="245.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Projects 0.15</text><text x="785.0" y="269.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">term overlap</text><rect x="475" y="304" width="200" height="80" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="575.0" y="337.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Education 0.10</text><text x="575.0" y="361.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">met / partial / not</text><rect x="685" y="304" width="200" height="80" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="785.0" y="337.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Qualifications 0.10</text><text x="785.0" y="361.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">certifications</text><path d="M 680 87 L 680 118" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="475" y="420" width="410" height="110" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="680.0" y="448.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Match score (0–100)</text><text x="680.0" y="472.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">Σ wᵢ·sᵢ / Σ wᵢ × 100 over the</text><text x="680.0" y="492.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">components that apply;</text><text x="680.0" y="512.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">no evidence → excluded, not 0</text><path d="M 680 396 L 680 418" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="475" y="560" width="410" height="90" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="680.0" y="588.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Explanation</text><text x="680.0" y="612.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">matched / missing skills,</text><text x="680.0" y="632.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">self-reported skills, reasoning</text><path d="M 680 530 L 680 558" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="475" y="680" width="410" height="72" rx="7" fill="#f7f9fb" stroke="#1f3a5f" stroke-width="1.6"/><text x="680.0" y="709.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Sort and return</text><text x="680.0" y="733.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">match ↓, retrieval ↓, job_id ↑</text><path d="M 680 650 L 680 678" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="450" y="965" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">Retrieval chooses which records are considered; deterministic code orders and explains them.</text></svg>
