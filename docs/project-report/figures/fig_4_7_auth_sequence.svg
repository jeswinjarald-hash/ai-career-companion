oke-width="1.6" marker-end="url(#arr)"/><text x="620.0" y="333" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733">find user by e-mail; verify hash</text><path d="M 450.0 370 L 490.0 370 L 490.0 388 L 454.0 388" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="498.0" y="384" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2733">token = token_urlsafe(48)</text><path d="M 450.0 418 L 786.0 418" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="620.0" y="411" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733">store SHA-256(token), 14-day expiry</text><path d="M 450.0 456 L 114.0 456" fill="none" stroke="#4a5868" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="280.0" y="449" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">Set-Cookie: HttpOnly; SameSite=Lax</text><rect x="30.0" y="476" width="840.0" height="28" fill="#fff8e5" stroke="#d6b25e" rx="3"/><text x="450.0" y="495" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733" font-style="italic">cookie is Secure whenever APP_ENV is not “development”</text><path d="M 110.0 536 L 446.0 536" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="280.0" y="529" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733">GET /api/… (cookie sent automatically)</text><path d="M 450.0 574 L 786.0 574" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="620.0" y="567" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733">look up SHA-256(cookie); check expiry</text><path d="M 450.0 612 L 114.0 612" fill="none" stroke="#4a5868" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="280.0" y="605" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">200 own data · 401 · 404 if not owner</text><path d="M 110.0 642 L 150.0 642 L 150.0 660 L 114.0 660" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="158.0" y="656" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2733">on 401: back to sign-in</text><path d="M 110.0 690 L 446.0 690" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="280.0" y="683" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733">POST /api/auth/logout</text><path d="M 450.0 728 L 786.0 728" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><text x="620.0" y="721" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2733">delete session row</text><path d="M 450.0 766 L 114.0 766" fill="none" stroke="#4a5868" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#arr)"/><text x="280.0" y="759" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">204, cookie cleared</text></svg>
