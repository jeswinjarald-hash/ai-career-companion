<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5868"/></marker><marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5651d"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="15" y="15" width="420" height="100" rx="7" fill="#f7f9fb" stroke="#1f3a5f" stroke-width="1.6"/><text x="225.0" y="48.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Evidence records</text><text x="225.0" y="72.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">skills, reliable projects, education,</text><text x="225.0" y="92.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">profile (self-reported), with IDs</text><rect x="465" y="15" width="420" height="100" rx="7" fill="#f7f9fb" stroke="#1f3a5f" stroke-width="1.6"/><text x="675.0" y="48.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Job record</text><text x="675.0" y="72.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">required / preferred skills,</text><text x="675.0" y="92.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">title, company, requirements</text><rect x="15" y="155" width="420" height="110" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="225.0" y="183.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Keyword alignment</text><text x="225.0" y="207.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">supported (direct evidence)</text><text x="225.0" y="227.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">partial (related evidence)</text><text x="225.0" y="247.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">unsupported (absent)</text><rect x="465" y="155" width="420" height="110" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="675.0" y="193.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Deterministic drafts</text><text x="675.0" y="217.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">summary · skill and project order</text><text x="675.0" y="237.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">cover letter · questions</text><path d="M 225 115 L 225 153" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 675 115 L 675 153" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 435 210 L 463 210" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="300" width="870" height="345" rx="10" fill="none" stroke="#8f98a3" stroke-width="1.6" stroke-dasharray="9 5"/><text x="27" y="321" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#8f98a3">Grounding validator — every generated sentence</text><rect x="35" y="335" width="405" height="135" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="237.5" y="375.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Unsupported keyword</text><text x="237.5" y="399.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">job term absent from the</text><text x="237.5" y="419.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">evidence (title and</text><text x="237.5" y="439.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">company name allowed)</text><rect x="460" y="335" width="405" height="135" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="662.5" y="375.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Fabrication patterns</text><text x="662.5" y="399.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">invented metrics (%, ×),</text><text x="662.5" y="419.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">“led a team”,</text><text x="662.5" y="439.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">“N years of experience”</text><rect x="35" y="485" width="405" height="135" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="237.5" y="525.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Unsupported claims</text><text x="237.5" y="549.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">technologies, degrees,</text><text x="237.5" y="569.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">employers, awards,</text><text x="237.5" y="589.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">quoted project names</text><rect x="460" y="485" width="405" height="135" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="662.5" y="525.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Parser reliability</text><text x="662.5" y="549.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">fragment projects excluded;</text><text x="662.5" y="569.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">parser warnings block</text><text x="662.5" y="589.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">a “passed” status</text><path d="M 675 265 L 675 285 L 450 285 L 450 298" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><polygon points="450,675.0 610.0,725 450,775.0 290.0,725" fill="#fff8e5" stroke="#b08d2e" stroke-width="1.6"/><text x="450" y="720.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2733">Sentence fails</text><text x="450" y="739.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2733">a check?</text><path d="M 450 645 L 450 673" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="15" y="830" width="360" height="90" rx="7" fill="#fbeaea" stroke="#a04040" stroke-width="1.6"/><text x="195.0" y="868.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Remove sentence</text><text x="195.0" y="892.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">recorded in removed_claims</text><path d="M 290 725 L 195 725 L 195 828" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="225.2" y="703" width="33.5" height="20" fill="white" opacity="0.92"/><text x="242" y="717" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">yes</text><rect x="525" y="830" width="360" height="90" rx="7" fill="#eef3f9" stroke="#1f3a5f" stroke-width="1.6"/><text x="705.0" y="858.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2733">Keep sentence</text><text x="705.0" y="882.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">passed = nothing removed</text><text x="705.0" y="902.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#4a5563">and no parser warning</text><path d="M 610 725 L 705 725 L 705 828" fill="none" stroke="#4a5868" stroke-width="1.6" marker-end="url(#arr)"/><rect x="645.2" y="703" width="25.7" height="20" fill="white" opacity="0.92"/><text x="658" y="717" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">no</text><text x="450" y="955" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">Edits are re-validated on save; generation is refused (HTTP 409)</text><text x="450" y="974" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4a5563">when only unreliable project fragments remain.</text></svg>
